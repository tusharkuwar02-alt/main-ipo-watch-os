name: Smart Money full historical backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/smart-money-backtest.mjs"
      - "lib/smart-money-backtest.mjs"
      - "lib/smart-money.mjs"
      - "tests/smart-money-backtest.test.mjs"
      - ".github/workflows/smart-money-backtest.yml"

permissions:
  contents: write

concurrency:
  group: smart-money-full-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore NSE archive cache
        uses: actions/cache@v4
        with:
          path: .cache/smart-money-bhavcopy
          key: nse-smart-money-bhavcopy-v1-${{ github.run_id }}
          restore-keys: nse-smart-money-bhavcopy-v1-
      - name: Run point-in-time backtest
        run: npm run backtest:smart-money
        env:
          BACKTEST_START: "2022-01-01"
          BACKTEST_DOWNLOAD_START: "2021-09-01"
      - name: Commit verified report
        run: |
          git config user.name "main-ipo-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/smart-money-backtest.json reports/smart-money-backtest-report.md reports/smart-money-backtest-trades.csv
          git diff --cached --quiet || git commit -m "data: publish Smart Money full backtest"
          git pull --rebase
          git push
