name: Quality Momentum Pullback full backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/quality-momentum-pullback-backtest.mjs"
      - "lib/quality-momentum-pullback.mjs"
      - "tests/quality-momentum-pullback.test.mjs"
      - ".github/workflows/quality-momentum-backtest.yml"

permissions:
  contents: write

concurrency:
  group: quality-momentum-full-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore NSE archive cache
        uses: actions/cache@v4
        with:
          path: .cache/smart-money-bhavcopy
          key: nse-smart-money-bhavcopy-v2-${{ github.run_id }}
          restore-keys: nse-smart-money-bhavcopy-v2-
      - name: Run Quality Momentum Pullback backtest
        run: npm run backtest:quality-momentum
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          BACKTEST_START: "2022-01-01"
          BACKTEST_DOWNLOAD_START: "2020-12-01"
      - name: Commit verified report
        run: |
          git config user.name "main-ipo-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/quality-momentum-pullback-backtest.json reports/quality-momentum-pullback-backtest-report.md reports/quality-momentum-pullback-2026-trades.csv
          git diff --cached --quiet || git commit -m "data: publish Quality Momentum Pullback backtest"
          git pull --rebase
          git push
