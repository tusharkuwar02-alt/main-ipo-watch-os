name: Precision60 RR2 upgrade backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/precision60-upgrade-backtest.mjs"
      - "lib/precision60-upgrade.mjs"
      - "tests/precision60-upgrade.test.mjs"
      - ".github/workflows/precision60-upgrade-backtest.yml"

permissions:
  contents: write

concurrency:
  group: precision60-rr2-upgrade
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: .cache/smart-money-bhavcopy
          key: nse-smart-money-bhavcopy-v2-${{ github.run_id }}
          restore-keys: nse-smart-money-bhavcopy-v2-
      - name: Run locked precision upgrade
        run: npm run backtest:precision60
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          BACKTEST_START: "2022-01-01"
          BACKTEST_DOWNLOAD_START: "2020-12-01"
      - name: Commit report
        run: |
          git config user.name "main-ipo-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/precision60-upgrade.json reports/precision60-upgrade-report.md reports/precision60-upgrade-2026-trades.csv
          git diff --cached --quiet || git commit -m "data: publish Precision60 RR2 upgrade"
          git pull --rebase
          git push
