name: Daily NSE IPO and Smart Money scans

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-scan.yml"
      - "scripts/smart-money-scan.mjs"
      - "lib/smart-money.mjs"
      - "lib/institutional-confirmation.mjs"
      - "lib/institutional-fast-mover-rr2.mjs"
      - "lib/quality-momentum-pullback.mjs"
  schedule:
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-nse-ipo-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore institutional disclosure cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/institutional-confirmation
            .cache/smart-money-live-prices
          key: nse-smart-money-live-v2-${{ github.run_id }}
          restore-keys: nse-smart-money-live-v2-
      - name: Build safe refreshed snapshot
        run: npm run scan
      - name: Build Smart Money snapshot
        run: npm run scan:smart-money
      - run: npm run build
      - name: Commit refreshed scan
        run: |
          git config user.name "main-ipo-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest-scan.json data/smart-money-latest.json
          git diff --cached --quiet || git commit -m "data: refresh NSE IPO scan"
          git push
