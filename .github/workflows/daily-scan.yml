name: Daily NSE IPO scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-nse-ipo-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build safe refreshed snapshot
        run: npm run scan
      - run: npm run build
      - name: Commit refreshed scan
        run: |
          git config user.name "main-ipo-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest-scan.json
          git diff --cached --quiet || git commit -m "data: refresh NSE IPO scan"
          git push
